<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-left">
            <h1>Hostel Management</h1>
            <p>Student & Hostel Administration System</p>
        </div>

        <div class="login-box">

            <h2>Login</h2>
            <p class="login-subtitle">Enter your credentials</p>

            <form id="loginForm">

                <label for="userId">User ID</label>
                <input
                    type="text"
                    id="userId"
                    placeholder="Enter User ID"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <p id="loginMessage" class="login-message"></p>

        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const userId = document.getElementById("userId").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("loginMessage");

            /*
             * C++ BACKEND API
             *
             * Your C++ backend should receive:
             * {
             *     "userId": "...",
             *     "password": "..."
             * }
             *
             * and return:
             *
             * {
             *     "success": true,
             *     "role": "admin"
             * }
             *
             * OR
             *
             * {
             *     "success": true,
             *     "role": "student"
             * }
             */

            try {

                const response = await fetch("http://localhost:8080/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        userId: userId,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {

                    sessionStorage.setItem("userId", userId);
                    sessionStorage.setItem("role", data.role);

                    if (data.role === "admin") {
                        window.location.href = "admin.html";
                    }
                    else {
                        window.location.href = "student.html";
                    }

                }
                else {

                    message.textContent = "Invalid User ID or Password.";
                    message.style.color = "red";

                }

            }
            catch (error) {

                /*
                 * DEMO LOGIN
                 *
                 * Remove this section when your C++ backend
                 * is connected.
                 */

                if (userId === "admin" && password === "admin123") {

                    sessionStorage.setItem("userId", "admin");
                    sessionStorage.setItem("role", "admin");

                    window.location.href = "admin.html";

                }
                else if (userId === "STU001" && password === "student123") {

                    sessionStorage.setItem("userId", "STU001");
                    sessionStorage.setItem("role", "student");

                    window.location.href = "student.html";

                }
                else {

                    message.textContent =
                        "Invalid User ID or Password.";

                    message.style.color = "red";
                }
            }

        });
    </script>

</body>
</html>
