<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-title">
            <h2>Hostel Admin</h2>
        </div>

        <nav>

            <button class="nav-btn active">
                Dashboard
            </button>

            <button class="nav-btn">
                Students
            </button>

            <button class="nav-btn">
                Rooms
            </button>

            <button class="nav-btn">
                Allocations
            </button>

            <button class="nav-btn">
                Complaints
            </button>

            <button class="nav-btn logout-btn">
                Logout
            </button>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="admin-main">

        <!-- HEADER -->

        <header class="topbar">

            <div>
                <h1 id="pageTitle">Dashboard</h1>
            </div>

            <div class="admin-user">
                Admin
            </div>

        </header>


    </main>

</div>

</body>
</html>
