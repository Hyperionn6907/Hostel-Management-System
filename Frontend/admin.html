<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            <h2>Hostel Admin</h2>
        </div>

        <nav>

            <button class="nav-btn active">
                Dashboard
            </button>

            <button class="nav-btn">
                Students
            </button>

            <button class="nav-btn">
                Rooms
            </button>

            
        <button class="nav-btn">
             Allocations
        </button>

        <button class="nav-btn" id="complaintsBtn">
                Complaints
        </button>

<button class="nav-btn logout-btn">
    Logout
</button>


        </nav>

    </aside>

    <main class="admin-main">


        <header class="topbar">

            <div>
                <h1 id="pageTitle">Dashboard</h1>
            </div>

            <div class="admin-user">
                Admin
            </div>

        </header>


        <section id="dashboard" class="content-section">

            <h2>Dashboard</h2>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h3>Students</h3>
                    <p id="studentCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Total Rooms</h3>
                    <p id="roomCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Occupied Rooms</h3>
                    <p id="occupiedRoomCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Unresolved Complaints</h3>
                    <p id="unresolvedCount">0</p>
                </div>

            </div>

        </section>
        
<section id="complaints" class="content-section" style="display: none;">

    <h2>Manage Complaints</h2>

    <p id="complaintMessage"></p>

    <table>
        <thead>
            <tr>
                <th>Complaint ID</th>
                <th>Student ID</th>
                <th>Description</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="complaintTableBody">
            <tr>
                <td colspan="6">Click Complaints to load records.</td>
            </tr>
        </tbody>
    </table>

</section>


    </main>

</div>


<script>
    document.getElementById("complaintsBtn").addEventListener("click", async function() {
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("complaints").style.display = "block";
        document.getElementById("pageTitle").textContent = "Complaints";

        const table = document.getElementById("complaintTableBody");
        table.innerHTML = "<tr><td colspan='6'>Loading complaints...</td></tr>";

        try {
            const response = await fetch("http://localhost:8080/api/complaints");
            const data = await response.json();

            const complaints = Array.isArray(data) ? data : data.complaints;

            if (!response.ok || !Array.isArray(complaints)) {
                throw new Error("Invalid response");
            }

            if (complaints.length === 0) {
                table.innerHTML = "<tr><td colspan='6'>No complaints found.</td></tr>";
                return;
            }

            table.innerHTML = "";

            complaints.forEach(function(c) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${c.complaint_id}</td>
                    <td>${c.student_id}</td>
                    <td></td>
                    <td>${c.status}</td>
                    <td>${c.created_at}</td>
                    <td>-</td>
                `;

                row.children[2].textContent = c.description;
                table.appendChild(row);
            });
        } catch (error) {
            table.innerHTML = "<tr><td colspan='6'>Could not load complaints. Check the backend API.</td></tr>";
        }
    });
</script>


</body>
</html>
