<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            <h2>Hostel Admin</h2>
        </div>

        <nav>

            <button class="nav-btn active">
                Dashboard
            </button>

            <button class="nav-btn">
                Students
            </button>

            <button class="nav-btn">
                Rooms
            </button>

            <button class="nav-btn">
                Allocations
            </button>

            <button class="nav-btn">
                Complaints
            </button>

            <button class="nav-btn logout-btn">
                Logout
            </button>

        </nav>

    </aside>

    <main class="admin-main">


        <header class="topbar">

            <div>
                <h1 id="pageTitle">Dashboard</h1>
            </div>

            <div class="admin-user">
                Admin
            </div>

        </header>


        <section id="dashboard" class="content-section">

            <h2>Dashboard</h2>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h3>Students</h3>
                    <p id="studentCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Total Rooms</h3>
                    <p id="roomCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Occupied Rooms</h3>
                    <p id="occupiedRoomCount">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Unresolved Complaints</h3>
                    <p id="unresolvedCount">0</p>
                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
