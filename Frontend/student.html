<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div>
            <h2>Hostel Management System</h2>
        </div>

        <button onclick="logout()" class="logout-btn">
            Logout
        </button>

    </header>

    <main class="student-container">

        <h1>Student Dashboard</h1>

        <!-- Student Information -->

        <section class="card">

            <h2>Student Details</h2>

            <div class="student-details">

                <div>
                    <span>Name</span>
                    <strong id="studentName">Rahul Kumar</strong>
                </div>

                <div>
                    <span>Roll Number</span>
                    <strong id="rollNumber">STU001</strong>
                </div>

                <div>
                    <span>Room Number</span>
                    <strong id="roomNumber">A-101</strong>
                </div>

                <div>
                    <span>Department</span>
                    <strong id="department">CSE</strong>
                </div>

            </div>

        </section>


        <!-- Complaint Statistics -->

        <section class="stats">

            <div class="stat-card">
                <h3>Complaints Registered</h3>
                <p id="totalComplaints">5</p>
            </div>

            <div class="stat-card">
                <h3>Complaints Resolved</h3>
                <p id="resolvedComplaints">3</p>
            </div>

        </section>


        <!-- Add Complaint -->

        <section class="card">

            <h2>Register a Complaint</h2>

            <form id="complaintForm">

                <label>Complaint</label>

                <textarea
                    id="complaintText"
                    placeholder="Enter your complaint..."
                    required>
                </textarea>

                <button type="submit" class="primary-btn">
                    Submit Complaint
                </button>

            </form>

            <p id="complaintMessage"></p>

        </section>

    </main>


    <script>

        // Check whether user is logged in

        const userType = sessionStorage.getItem("userType");

        if (userType !== "student") {
            window.location.href = "login.html";
        }


        // Submit complaint

        document.getElementById("complaintForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            const complaint =
                document.getElementById("complaintText").value;

            /*
             * Later:
             *
             * complaint will be sent to the C++ backend.
             *
             * C++ will insert:
             *
             * student_id
             * complaint
             * status = "Not Resolved"
             *
             * into MySQL.
             */

            console.log("Complaint:", complaint);

            document.getElementById("complaintMessage").innerText =
                "Complaint submitted successfully.";

            document.getElementById("complaintText").value = "";

        });


        // Logout

        function logout() {

            sessionStorage.clear();

            window.location.href = "login.html";

        }

    </script>

</body>
</html>
