<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <!-- Paste the complete CSS here -->
    <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        font-family: Arial, sans-serif;
        background: #f1f5fb;
        color: #17315b;
    }

    h1 {
        background: #17315b;
        color: white;
        padding: 25px 35px;
        margin: 0;
    }

    body > h2,
    body > p,
    body > hr,
    body > form,
    body > textarea,
    body > button,
    body > #complaintHistory {
        margin-left: 30px;
        margin-right: 30px;
    }

    #studentName {
        font-size: 28px;
        color: #1457d9;
        margin-top: 30px;
    }

    #studentId,
    #email,
    #department,
    #phone {
        display: inline-block;
        width: calc(25% - 40px);
        min-width: 180px;
        padding: 20px;
        margin: 10px;
        background: white;
        border-radius: 12px;
        border: 1px solid #dbe6f5;
    }

    hr {
        margin-top: 35px;
        margin-bottom: 30px;
        border: 0;
        border-top: 1px solid #ccd9eb;
    }

    textarea {
        display: block;
        width: calc(100% - 60px);
        min-height: 130px;
        padding: 15px;
        font: inherit;
        border: 1px solid #c7d7ef;
        border-radius: 10px;
        resize: vertical;
    }

    button {
        background: #1760e8;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 14px 24px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1049b5;
    }

    #complaintHistory {
        padding: 24px;
        background: white;
        border-radius: 12px;
        border: 1px solid #dbe6f5;
        min-height: 100px;
    }

    #message,
    #complaintMessage {
        color: #15803d;
        margin: 15px 30px;
    }

    @media (max-width: 700px) {
        body > h2,
        body > p,
        body > hr,
        body > form,
        body > textarea,
        body > button,
        body > #complaintHistory {
            margin-left: 16px;
            margin-right: 16px;
        }

        #studentId,
        #email,
        #department,
        #phone {
            width: calc(100% - 40px);
        }

        textarea {
            width: calc(100% - 32px);
        }
    }
</style>

    </style>
</head>
<body>
    <h1>Student Dashboard</h1>

    <h2 id="studentName">Loading student details...</h2>
    <p id="studentId"></p>
    <p id="email"></p>
    <p id="department"></p>
    <p id="phone"></p>
    <p id="message"></p>

    <hr>

    <h2>Submit a Complaint</h2>

    <form id="complaintForm">
        <label for="description">Describe your complaint:</label><br>
        <textarea id="description" maxlength="500"
            rows="5" required></textarea><br><br>

        <button type="submit">Submit Complaint</button>
    </form>

    <p id="complaintMessage"></p>

    <script>
        const userId = sessionStorage.getItem("userId");

        async function loadStudentDetails() {
            if (!userId) {
                document.getElementById("message").textContent =
                    "Please log in first.";
                return;
            }

            try {
                const response = await fetch(
                    `http://localhost:8080/api/students/${userId}`
                );

                const data = await response.json();

                if (data.success) {
                    document.getElementById("studentName").textContent =
                        "Welcome, " + data.name;

                    document.getElementById("studentId").textContent =
                        "Student ID: " + data.student_id;

                    document.getElementById("email").textContent =
                        "Email: " + data.email;

                    document.getElementById("department").textContent =
                        "Department: " + data.department;

                    document.getElementById("phone").textContent =
                        "Phone: " + data.phone;
                } else {
                    document.getElementById("message").textContent =
                        "Student details not found.";
                }
            } catch (error) {
                document.getElementById("message").textContent =
                    "Could not connect to the backend.";
            }
        }

        document.getElementById("complaintForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const description =
                    document.getElementById("description").value.trim();

                const message =
                    document.getElementById("complaintMessage");

                if (!userId || !/^\d+$/.test(userId)) {
                    message.textContent = "Please log in with a valid student ID.";
                    return;
                }

                if (!description || description.length > 500) {
                    message.textContent =
                        "Enter a complaint between 1 and 500 characters.";
                    return;
                }

                try {
                    const response = await fetch(
                        "http://localhost:8080/api/complaints",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                student_id: Number(userId),
                                description: description
                            })
                        }
                    );

                    const data = await response.json();

                    if (response.ok && data.success) {
                        message.textContent =
                            "Complaint submitted successfully! Status: Pending.";
                        document.getElementById("complaintForm").reset();
                    } else {
                        message.textContent =
                            data.message || "Failed to submit complaint.";
                    }
                } catch (error) {
                    message.textContent =
                        "Could not connect to the backend.";
                }
            });

        loadStudentDetails();
    </script>
</body>
</html>
