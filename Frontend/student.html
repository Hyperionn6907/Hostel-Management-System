<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="student-layout">

    <!-- HEADER -->

    <header class="student-header">

        <div>

            <h1>Hostel Management System</h1>

            <p>Student Portal</p>

        </div>

        <button class="logout-button"
                onclick="logout()">
            Logout
        </button>

    </header>


    <main class="student-main">

        <h2>Welcome, <span id="studentName">Student</span></h2>


        <!-- STUDENT DETAILS -->

        <div class="student-details">

            <div class="detail-card">

                <h3>Name</h3>

                <p id="studentNameCard">
                    Loading...
                </p>

            </div>


            <div class="detail-card">

                <h3>Roll Number</h3>

                <p id="rollNumber">
                    Loading...
                </p>

            </div>


            <div class="detail-card">

                <h3>Room Number</h3>

                <p id="roomNumber">
                    Loading...
                </p>

            </div>


            <div class="detail-card">

                <h3>Complaints Registered</h3>

                <p id="complaintsRegistered">
                    0
                </p>

            </div>


            <div class="detail-card">

                <h3>Complaints Resolved</h3>

                <p id="complaintsResolved">
                    0
                </p>

            </div>

        </div>


        <!-- ADD COMPLAINT -->

        <div class="complaint-box">

            <h2>Register a Complaint</h2>

            <p>
                Enter your complaint below.
            </p>

            <form id="complaintForm">

                <textarea
                    id="complaintText"
                    placeholder="Describe your complaint..."
                    required>
                </textarea>

                <button type="submit"
                        class="primary-btn">
                    Submit Complaint
                </button>

            </form>

            <p id="complaintMessage"></p>

        </div>


        <!-- PREVIOUS COMPLAINTS -->

        <div class="previous-complaints">

            <h2>My Complaints</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Complaint</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="studentComplaintsBody">
                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script src="student.js"></script>

</body>
</html>
